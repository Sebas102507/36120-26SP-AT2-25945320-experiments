name: Sync production models to API

# Copies the production artefacts into the API repository on every push to main, using the same
# layout as `make artefacts` in the API repository:
#   models/preprocessing/     fitted nucleus_ml preprocessing pipeline
#   models/comfort_climate/   promoted CCI bundle
#   models/weather_hazard/    promoted WHC bundle
# Each bundle keeps its own folder because both contain metadata.json, manifest.json,
# drift_reference.json and promotion.json.
#
# Requires the repository secret API_REPO_TOKEN: a token with write access to the API repository.

on:
  push:
    branches:
      - main
    paths:
      - "models/preprocessing/**"
      - "models/comfort_climate/production/**"
      - "models/weather_hazard/production/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-production-models:
    runs-on: ubuntu-latest
    env:
      API_REPOSITORY: Sebas102507/36120-26SP-AT2-25945320-api
      API_MODEL_DIRECTORY: models
    steps:
      - name: Check out experiments repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check that every artefact exists
        run: |
          test -f models/preprocessing/feature_pipeline.joblib
          test -f models/comfort_climate/production/manifest.json
          test -f models/weather_hazard/production/manifest.json

      - name: Check out API repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.API_REPOSITORY }}
          ref: main
          token: ${{ secrets.API_REPO_TOKEN }}
          path: api-repository

      - name: Replace API models with production artefacts
        run: |
          destination="api-repository/${API_MODEL_DIRECTORY}"
          # Start from an empty folder so a previous champion's files cannot linger.
          rm -rf "$destination"
          mkdir -p "$destination"

          rsync -av --exclude=".gitkeep" models/preprocessing/ "$destination/preprocessing/"
          rsync -av --exclude=".gitkeep" \
            models/comfort_climate/production/ "$destination/comfort_climate/"
          rsync -av --exclude=".gitkeep" \
            models/weather_hazard/production/ "$destination/weather_hazard/"

          echo "Models now in ${API_MODEL_DIRECTORY}:"
          find "$destination" -type f | sort

      - name: Commit and push changed artefacts
        working-directory: api-repository
        run: |
          git add -A -- "${API_MODEL_DIRECTORY}"

          if git diff --cached --quiet; then
            echo "No production model changes to sync."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync production model artefacts"
          git push origin main
